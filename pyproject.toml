[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time Hindi / English / Hinglish voice agent on CPU: VAD + fine-tuned int8 Whisper, a tool-using LLM, sentence-streamed Piper TTS and barge-in."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy",
  "soundfile",
  "onnxruntime",
  "faster-whisper>=1.1",
  "piper-tts>=1.3",
  "httpx",
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
eval = ["jiwer>=3.0", "pyarrow"]
dev = ["pytest"]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["static/*", "data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
